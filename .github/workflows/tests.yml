name: tests

on:
  push:
    branches: [main, "v[0-9]*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Configure git for the tests' commits
        run: |
          git config --global user.email "ci@orgforge.local"
          git config --global user.name "OrgForge CI"
          git config --global core.autocrlf false
      - name: Test (offline mock agents, no API key needed)
        run: python -m pytest -q -p no:cacheprovider
