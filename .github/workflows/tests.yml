name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Configure git for the tests' commits
        run: git config --global user.email "ci@orgforge.local" && git config --global user.name "OrgForge CI"
      - name: Test (offline mock agents, no API key needed)
        run: python -m pytest -q
