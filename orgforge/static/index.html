<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrgForge</title>
<style>
  :root {
    --paper: #edf0f3; --panel: #fbfcfd; --ink: #17212b; --soft: #55626f; --line: #cbd3db;
    --cobalt: #2348c9; --good: #1f7a52; --warn: #a86a0b; --bad: #a8321f; --wash: #e3e8f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141a21; --panel: #1b232c; --ink: #e6ebf0; --soft: #9aa7b4; --line: #323d49;
            --cobalt: #8ea6ff; --good: #5cc496; --warn: #e0a84a; --bad: #f08a76; --wash: #232d45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 { font-size: 1.35rem; } h2 { font-size: 1.05rem; margin-bottom: .7rem; } h3 { font-size: .95rem; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: .35rem .75rem; }
  button.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--panel); font-weight: 600; }
  button.quiet { border-color: transparent; background: none; color: var(--cobalt); padding: .1rem .3rem; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: .45rem .6rem; }
  textarea { resize: vertical; min-height: 4.5rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--line); }
  header p { margin: 0; color: var(--soft); }
  main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 1.5rem; padding: 1.5rem; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } }
  #decisions { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
  @media (max-width: 880px) { #decisions { position: static; max-height: none; } }
  section { margin-bottom: 1.75rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; margin-bottom: .8rem; overflow-x: auto; }
  .decision { border-left: 5px solid var(--cobalt); }
  .decision.other { border-left-color: var(--line); }
  .decision pre { white-space: pre-wrap; font: inherit; font-size: .88rem; color: var(--soft); max-height: 14rem; overflow: auto; margin: .5rem 0; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--soft); font-size: .88rem; }
  .track { display: flex; gap: 3px; margin: .6rem 0; }
  .track span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .track span.past { background: var(--cobalt); } .track span.now { background: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-weight: 600; color: var(--soft); }
  th, td { padding: .35rem .5rem .35rem 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.gone td { color: var(--soft); }
  .chip { display: inline-block; padding: 0 .5rem; border-radius: 99px; font-size: .8rem; border: 1px solid currentColor; }
  .active, .done { color: var(--good); } .probation, .in_progress, .todo { color: var(--warn); }
  .fired, .failed { color: var(--bad); }
  .bar { width: 70px; height: 6px; background: var(--line); border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: .4rem; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
  .bar i.mid { background: var(--warn); } .bar i.low { background: var(--bad); }
  #log { font-size: .86rem; max-height: 22rem; overflow: auto; }
  #log div { padding: .2rem 0; border-bottom: 1px solid var(--line); }
  #signin { max-width: 380px; margin: 12vh auto; }
  #error { color: var(--bad); min-height: 1.4rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .in_review, .backlog, .cancelled { color: var(--soft); } .in_review { color: var(--cobalt); }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: .6rem; overflow-x: auto; padding-bottom: .4rem; }
  .col { background: var(--wash); border-radius: 8px; padding: .5rem; min-height: 6rem; }
  .col h3 { font-size: .82rem; color: var(--soft); text-transform: uppercase; letter-spacing: .04em; margin: .1rem .2rem .5rem; }
  .ticket { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem; margin-bottom: .45rem; }
  .ticket:hover { border-color: var(--cobalt); }
  .ticket .t-title { display: block; margin: .15rem 0 .3rem; line-height: 1.3; }
  .ticket.is-cancelled .t-title { text-decoration: line-through; color: var(--soft); }
  .key { font-size: .78rem; font-weight: 650; color: var(--soft); font-variant-numeric: tabular-nums; }
  .prio { font-size: .76rem; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; }
  .prio.urgent { color: var(--bad); } .prio.high { color: var(--warn); } .prio.medium, .prio.low { color: var(--soft); }
  .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: .5rem; margin-bottom: .7rem; }
  @media (max-width: 620px) { .filters { grid-template-columns: 1fr 1fr; } }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(680px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); padding: 1.1rem 1.2rem; }
  dialog::backdrop { background: rgb(10 15 20 / .45); }
  .field { margin: .55rem 0; } .field > span:first-child { display: block; font-size: .8rem; color: var(--soft); margin-bottom: .15rem; }
  .history { border-top: 1px solid var(--line); margin-top: .8rem; padding-top: .5rem; max-height: 18rem; overflow: auto; }
  .history div { padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .history pre { white-space: pre-wrap; font: inherit; margin: .15rem 0 0; }
  .history .comment { border-left: 3px solid var(--cobalt); padding-left: .55rem; }
  .history .transfer, .history .handoff { border-left: 3px solid var(--warn); padding-left: .55rem; }
  .dept { font-size: .78rem; color: var(--soft); display: block; margin-bottom: .2rem; }
  tr[data-ticket] { cursor: pointer; } tr[data-ticket]:hover td { color: var(--cobalt); }
</style>
</head>
<body>
<div id="signin" class="card" hidden>
  <h1>Sign in to your company</h1>
  <p class="muted">Paste the CEO or CTO token printed when the server started.</p>
  <input id="token" type="password" placeholder="Token" autocomplete="off">
  <p id="signin-error" class="muted"></p>
  <button class="primary" id="signin-btn">Sign in</button>
</div>

<div id="app" hidden>
  <header>
    <div><h1 id="company"></h1><p id="whoami"></p></div>
    <div class="row"><span id="error"></span><button id="signout">Sign out</button></div>
  </header>
  <main>
    <aside id="decisions">
      <h2>Waiting for a decision</h2>
      <div id="inbox"></div>
    </aside>
    <div>
      <section>
        <h2>Projects</h2>
        <div class="card">
          <h3>Start a project</h3>
          <div style="margin:.5rem 0"><input id="p-name" placeholder="Product name"></div>
          <textarea id="p-brief" placeholder="What should the team build? Who is it for? What must the first release do?"></textarea>
          <div class="row" style="margin-top:.5rem"><button class="primary" id="p-start">Start project</button></div>
        </div>
        <div id="projects"></div>
      </section>
      <section>
        <div class="row" style="justify-content:space-between;margin-bottom:.7rem"><h2 style="margin:0">Tickets</h2>
          <button class="primary" id="t-new">New ticket</button></div>
        <div class="filters">
          <select id="f-project" aria-label="Project"></select>
          <select id="f-dept" aria-label="Department"></select>
          <input id="f-text" placeholder="Search tickets" aria-label="Search tickets">
          <label class="muted row" style="flex-wrap:nowrap"><input type="checkbox" id="f-cancelled" style="width:auto"> Cancelled</label>
        </div>
        <div class="board" id="board"></div>
      </section>
      <section>
        <h2>People</h2>
        <div id="people"></div>
        <div class="card">
          <h3>Hire an agent</h3>
          <div class="grid2" style="margin:.5rem 0">
            <select id="h-role" aria-label="Role"></select>
            <input id="h-name" placeholder="Name (blank: the team picks one)">
          </div>
          <button id="h-go">Hire</button>
          <label class="muted" style="margin-left:.75rem"><input type="checkbox" id="show-fired" style="width:auto"> Show former agents</label>
        </div>
      </section>
      <section>
        <h2>Activity</h2>
        <div class="card" id="log"></div>
      </section>
    </div>
  </main>
</div>

<dialog id="new-dlg">
  <h2>New ticket</h2>
  <label class="field"><span>Project</span><select id="n-project"></select></label>
  <label class="field"><span>Title</span><input id="n-title" placeholder="What needs doing?"></label>
  <label class="field"><span>Description</span><textarea id="n-desc" placeholder="Details and acceptance criteria. The agent reads this."></textarea></label>
  <div class="grid2">
    <label class="field"><span>Type</span><select id="n-type"></select></label>
    <label class="field"><span>Priority</span><select id="n-priority"></select></label>
    <label class="field"><span>Assign to role</span><select id="n-role"></select></label>
    <label class="field"><span>Status</span><select id="n-status"><option value="backlog">Backlog (triage later)</option><option value="todo">To do (team starts it)</option></select></label>
  </div>
  <p class="muted">A to-do ticket on a released or releasing product sends it back to build and re-runs the release checks.</p>
  <p id="n-error" class="muted" style="color:var(--bad)"></p>
  <div class="row"><button class="primary" id="n-save">File ticket</button><button id="n-cancel">Cancel</button></div>
</dialog>

<dialog id="ticket-dlg"><div id="ticket-body"></div></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = sessionStorage.getItem("orgforge-token") || "";
let state = null;
const drafts = {};

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) { signOut("That token was not accepted."); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

function signOut(message) {
  token = ""; sessionStorage.removeItem("orgforge-token");
  $("app").hidden = true; $("signin").hidden = false; $("signin-error").textContent = message || "";
}

async function act(fn) {
  $("error").textContent = "";
  try { await fn(); await refresh(true); } catch (e) { if (e.message !== "unauthorized") $("error").textContent = e.message; }
}

async function refresh(force) {
  if (!token) return signOut();
  const busy = ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement?.tagName);
  try { state = await api("/api/state"); } catch { return; }
  $("signin").hidden = true; $("app").hidden = false;
  if (busy && !force) return;             // don't redraw under someone typing
  render();
  if (openTicketId && !force) loadTicket(openTicketId).catch(() => {});
}

function render() {
  const me = state.you.role;
  $("company").textContent = state.company;
  $("whoami").textContent = `Signed in as ${state.you.name}, ${me.toUpperCase()}`;
  document.title = `${state.approvals.filter(a => a.required_role === me).length || ""} ${state.company}`.trim();

  $("inbox").innerHTML = state.approvals.length ? state.approvals.map(a => {
    const mine = a.required_role === me;
    return `<div class="card decision ${mine ? "" : "other"}">
      <h3>${esc(a.title)}</h3>
      <div class="muted">${mine ? "Your call" : `With ${esc(state.humans[a.required_role])} (${a.required_role.toUpperCase()})`}</div>
      <pre>${esc(a.summary)}</pre>
      ${mine ? `<textarea data-draft="${a.id}" placeholder="What should change? Required to send back.">${esc(drafts[a.id] || "")}</textarea>
      <div class="row" style="margin-top:.5rem">
        ${a.kind === "release_blocked" ? `<span class="muted">Checks must pass before release. Send repair guidance to retry.</span>` : `<button class="primary" data-decide="approved" data-id="${a.id}">Approve</button>`}
        <button data-decide="rejected" data-id="${a.id}">Send back</button>
      </div>` : ""}
    </div>`;
  }).join("") : `<div class="card muted">Nothing needs you right now. The team keeps working until it does.</div>`;

  const order = state.stages.map(s => s.id);
  $("projects").innerHTML = state.projects.map(p => {
    const at = order.indexOf(p.stage);
    const track = state.stages.filter(s => !["escalation", "contract_review", "release_blocked"].includes(s.id)).map(s => {
      const i = order.indexOf(s.id);
      return `<span title="${esc(s.label)}" class="${p.stage === "done" || i < at ? "past" : i === at ? "now" : ""}"></span>`;
    }).join("");
    const tasks = p.tasks.length ? `<table><tr><th>Ticket</th><th>Task</th><th>Owner</th><th>Status</th></tr>${p.tasks.map(t =>
      `<tr data-ticket="${t.id}"><td class="key">T-${t.id}</td><td>${esc(t.title)}${t.attempts ? ` <span class="muted">sent back ${t.attempts}×</span>` : ""}</td>
       <td>${esc(t.assignee || "")}</td><td><span class="chip ${t.status}">${esc(state.ticket_meta.statuses[t.status] || t.status)}</span></td></tr>`).join("")}</table>` : "";
    return `<div class="card">
      <div class="row" style="justify-content:space-between"><h3>${esc(p.name)}</h3><span class="muted">${esc(p.stage_label)}</span></div>
      <div class="track">${track}</div>
      <div class="muted">${esc(p.workspace)}</div>${tasks}
      ${p.stage === "done" ? "" : `<button class="quiet" data-run="${p.id}">Resume work</button>`}
    </div>`;
  }).join("") || `<p class="muted">No projects yet. Write a brief above to start one.</p>`;

  const showFired = $("show-fired").checked;
  $("people").innerHTML = state.departments.map(d => {
    const canManage = me === "ceo" || d.reports_to === "cto";
    const rows = d.agents.filter(a => showFired || a.status !== "fired").map(a => {
      const s = a.score, cls = s == null ? "" : s < 45 ? "low" : s < 65 ? "mid" : "";
      const score = s == null ? `<span class="muted">no reviews yet</span>` : `<span class="bar"><i class="${cls}" style="width:${s}%"></i></span>${s.toFixed(0)} <span class="muted">(${a.evals})</span>`;
      const actions = !canManage ? "" : a.status === "fired"
        ? `<button class="quiet" data-rehire="${a.id}">Rehire</button>`
        : `<button class="quiet" data-fire="${a.id}" data-name="${esc(a.name)}">Replace</button>`;
      return `<tr class="${a.status === "fired" ? "gone" : ""}"><td>${esc(a.name)}${a.generation > 1 ? ` <span class="muted">gen ${a.generation}</span>` : ""}</td>
        <td>${esc(a.role_title)}</td><td><span class="chip ${a.status}">${a.status}</span></td><td>${score}</td>
        <td class="muted">${esc(a.model)}</td><td>${actions}</td></tr>`;
    }).join("");
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(d.name)}</h3>
      <span class="muted">Reports to ${esc(state.humans[d.reports_to])}</span></div>
      ${rows ? `<table><tr><th>Name</th><th>Role</th><th>Standing</th><th>Score</th><th>Model</th><th></th></tr>${rows}</table>` : `<p class="muted">No agents. Hire one below.</p>`}</div>`;
  }).join("");

  const pick = $("h-role").value;
  $("h-role").innerHTML = state.departments.filter(d => me === "ceo" || d.reports_to === "cto")
    .flatMap(d => d.roles.map(r => `<option value="${esc(r.id)}">${esc(r.title)} (${esc(d.name)})</option>`)).join("");
  if (pick) $("h-role").value = pick;

  $("log").innerHTML = state.events.map(e =>
    `<div><span class="muted">${esc(e.ts.slice(11, 19))} ${esc(e.actor)}</span> ${esc(e.message)}</div>`).join("") || "Nothing yet.";
  renderTickets();
}

const COLUMNS = ["backlog", "todo", "in_progress", "in_review", "failed", "done"];
let openTicketId = null, ticketShown = "", boardShown = "";
const ticketDrafts = {};                  // unsaved edits survive the 4-second refresh

function options(el, items, keep = true) {
  const was = el.value;
  el.innerHTML = items.map(([v, label]) => `<option value="${esc(v)}">${esc(label)}</option>`).join("");
  if (keep && items.some(([v]) => String(v) === was)) el.value = was;
}

function renderTickets() {
  const m = state.ticket_meta;
  options($("f-project"), [["", "All projects"], ...state.projects.map(p => [p.id, p.name])]);
  const depts = [...new Set(state.tickets.map(t => t.department).filter(Boolean))].sort();
  options($("f-dept"), [["", "All departments"], ...depts.map(d => [d, d])]);
  const project = $("f-project").value, dept = $("f-dept").value, text = $("f-text").value.trim().toLowerCase();
  const showCancelled = $("f-cancelled").checked;
  const shown = state.tickets.filter(t => (!project || String(t.project_id) === project) && (!dept || t.department === dept)
    && (showCancelled || t.status !== "cancelled")
    && (!text || `${t.ticket} ${t.title} ${t.assignee || ""}`.toLowerCase().includes(text)));
  const sig = JSON.stringify([shown, project]);
  if (sig === boardShown) return;          // unchanged: keep the DOM so clicks and focus are not lost
  boardShown = sig;
  $("board").innerHTML = COLUMNS.map(c => {
    const cards = shown.filter(t => t.status === c || (c === "done" && t.status === "cancelled"));
    return `<div class="col"><h3>${esc(m.statuses[c])} · ${cards.length}</h3>${cards.map(t => `
      <button class="ticket is-${t.status}" data-ticket="${t.id}">
        <span class="row" style="justify-content:space-between"><span class="key">${esc(t.ticket)}</span><span class="prio ${t.priority}">${esc(t.priority)}</span></span>
        <span class="t-title">${esc(t.title)}</span>
        <span class="dept">${esc(t.department)}</span>
        <span class="row muted" style="justify-content:space-between"><span>${esc(t.type)}${project ? "" : ` · ${esc(t.project)}`}</span>
        <span>${esc(t.assignee || "")}${t.comments ? ` · ${t.comments} 💬` : ""}</span></span>
      </button>`).join("")}</div>`;
  }).join("");
}

async function loadTicket(id) {
  const t = await api(`/api/tickets/${id}`);
  const sig = JSON.stringify(t);
  if ($("ticket-dlg").open && openTicketId === t.id && sig === ticketShown) return;
  openTicketId = t.id; ticketShown = sig;
  const m = state.ticket_meta, editable = ["backlog", "todo"].includes(t.status) && t.origin !== "stage", closed = ["done", "cancelled"].includes(t.status);
  const statusField = editable
    ? `<select id="d-status">${["backlog", "todo", "cancelled"].map(s => `<option value="${s}" ${s === t.status ? "selected" : ""}>${esc(m.statuses[s])}</option>`).join("")}</select>`
    : `<span class="chip ${t.status}">${esc(t.status_label)}</span> <span class="muted">${closed ? "" : "The team owns this status."}</span>`;
  const prioField = closed ? `<span class="prio ${t.priority}">${esc(t.priority)}</span>`
    : `<select id="d-priority">${m.priorities.map(p => `<option ${p === t.priority ? "selected" : ""}>${p}</option>`).join("")}</select>`;
  $("ticket-body").innerHTML = `
    <div class="row" style="justify-content:space-between"><span class="key">${esc(t.ticket)} · ${esc(t.type)} · ${esc(t.project)}</span>
      <button class="quiet" id="d-close" aria-label="Close">Close</button></div>
    ${editable ? `<label class="field"><span>Title</span><input id="d-title" value="${esc(t.title)}"></label>` : `<h2 style="margin:.4rem 0">${esc(t.title)}</h2>`}
    <div class="grid2"><div class="field"><span>Status</span>${statusField}</div><div class="field"><span>Priority</span>${prioField}</div></div>
    ${editable && t.origin !== "stage" ? `<label class="field"><span>Owner (transfer to another department)</span><select id="d-role">${
      m.roles.map(r => `<option value="${esc(r.id)}" ${r.id === t.role ? "selected" : ""}>${esc(r.department)} · ${esc(r.title)}</option>`).join("")}</select></label>` : ""}
    <p class="muted">${esc(t.department)} · ${esc(t.role)} · ${t.assignee ? `assigned to ${esc(t.assignee)}` : "unassigned"} · reported by ${esc(t.reporter)} · ${esc(t.created_at.slice(0, 16).replace("T", " "))}${t.attempts ? ` · sent back ${t.attempts}×` : ""}</p>
    ${editable ? `<label class="field"><span>Description</span><textarea id="d-desc" rows="5">${esc(t.description)}</textarea></label>`
               : `<div class="field"><span>Description</span><pre style="white-space:pre-wrap;font:inherit;margin:0">${esc(t.description) || '<span class="muted">None</span>'}</pre></div>`}
    ${closed ? "" : `<button id="d-save">Save changes</button>`}
    <p id="d-error" class="muted" style="color:var(--bad)"></p>
    <div class="history">${t.history.map(h => `<div class="${h.kind}"><span class="muted">${esc(h.created_at.slice(0, 16).replace("T", " "))} · ${esc(h.author)}${({ comment: " commented", transfer: " transferred", handoff: " handed off" })[h.kind] || ""}</span><pre>${esc(h.body)}</pre></div>`).join("") || '<span class="muted">No history yet.</span>'}</div>
    <label class="field"><span>Comment</span><textarea id="d-comment" placeholder="The agent who works this ticket next will read your comment."></textarea></label>
    <button class="primary" id="d-comment-go">Comment</button>`;
  for (const [field, value] of Object.entries(ticketDrafts[t.id] || {})) if ($(field)) $(field).value = value;
  if (!$("ticket-dlg").open) $("ticket-dlg").showModal();
}

async function ticketAct(fn) {
  try { await fn(); await loadTicket(openTicketId); await refresh(true); }
  catch (e) { if (e.message !== "unauthorized" && $("d-error")) $("d-error").textContent = e.message; }
}

document.addEventListener("click", e => {
  const row = e.target.closest("[data-ticket]");
  if (row) return act(() => loadTicket(row.dataset.ticket));
  const id = e.target.id;
  if (id === "d-close") $("ticket-dlg").close();
  else if (id === "d-comment-go") ticketAct(async () => {
    await api(`/api/tickets/${openTicketId}/comments`, { body: $("d-comment").value });
    delete (ticketDrafts[openTicketId] || {})["d-comment"];
  });
  else if (id === "d-save") ticketAct(async () => {
    const body = { priority: $("d-priority")?.value };
    if ($("d-status")) Object.assign(body, { status: $("d-status").value, title: $("d-title").value, description: $("d-desc").value });
    if ($("d-role")) body.role = $("d-role").value;
    await api(`/api/tickets/${openTicketId}`, body);
    for (const f of ["d-title", "d-desc", "d-status", "d-priority", "d-role"]) delete (ticketDrafts[openTicketId] || {})[f];
  });
});
document.addEventListener("input", e => {
  if (openTicketId && ["d-title", "d-desc", "d-status", "d-priority", "d-role", "d-comment"].includes(e.target.id))
    (ticketDrafts[openTicketId] ||= {})[e.target.id] = e.target.value;
});
$("ticket-dlg").addEventListener("close", () => { openTicketId = null; ticketShown = ""; });
$("t-new").onclick = () => {
  const m = state.ticket_meta;
  if (!state.projects.length) { $("error").textContent = "Start a project before filing tickets."; return; }
  options($("n-project"), state.projects.map(p => [p.id, p.name]));
  if ($("f-project").value) $("n-project").value = $("f-project").value;
  options($("n-type"), m.types.map(t => [t, t[0].toUpperCase() + t.slice(1)]));
  options($("n-priority"), m.priorities.map(p => [p, p[0].toUpperCase() + p.slice(1)]));
  if (!$("n-priority").dataset.init) { $("n-priority").value = "medium"; $("n-priority").dataset.init = 1; }
  options($("n-role"), [["", "Engineering (whoever built most of it)"], ...m.roles.map(r => [r.id, `${r.department} · ${r.title}`])]);
  $("n-error").textContent = "";
  $("new-dlg").showModal();
};
$("n-cancel").onclick = () => $("new-dlg").close();
$("n-save").onclick = async () => {
  try {
    const t = await api("/api/tickets", { project_id: Number($("n-project").value), title: $("n-title").value,
      description: $("n-desc").value, type: $("n-type").value, priority: $("n-priority").value,
      status: $("n-status").value, role: $("n-role").value || null });
    $("n-title").value = ""; $("n-desc").value = ""; $("new-dlg").close();
    await refresh(true); await loadTicket(t.id);
  } catch (e) { if (e.message !== "unauthorized") $("n-error").textContent = e.message; }
};
["f-project", "f-dept", "f-cancelled"].forEach(id => $(id).onchange = renderTickets);
$("f-text").oninput = renderTickets;

document.addEventListener("input", e => { if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value; });
document.addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.decide) act(async () => { await api(`/api/approvals/${d.id}`, { decision: d.decide, feedback: drafts[d.id] || "" }); delete drafts[d.id]; });
  else if (d.run) act(() => api(`/api/projects/${d.run}/run`, {}));
  else if (d.rehire) act(() => api(`/api/agents/${d.rehire}/rehire`, {}));
  else if (d.fire) {
    const reason = prompt(`Why is ${d.name} being replaced? A successor takes the seat and inherits the lessons.`);
    if (reason) act(() => api(`/api/agents/${d.fire}/fire`, { reason, replace: true }));
  }
});
$("p-start").onclick = () => act(async () => {
  await api("/api/projects", { name: $("p-name").value, brief: $("p-brief").value });
  $("p-name").value = ""; $("p-brief").value = "";
});
$("h-go").onclick = () => act(async () => { await api("/api/agents", { role: $("h-role").value, name: $("h-name").value }); $("h-name").value = ""; });
$("show-fired").onchange = render;
$("signout").onclick = () => signOut();
$("signin-btn").onclick = () => { token = $("token").value.trim(); sessionStorage.setItem("orgforge-token", token); $("token").value = ""; refresh(true); };
$("token").onkeydown = e => { if (e.key === "Enter") $("signin-btn").click(); };

refresh(true);
setInterval(refresh, 4000);
</script>
</body>
</html>
