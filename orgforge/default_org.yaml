# Your company. `orgforge init` copies this file to ./org.yaml and seeds the
# database from it. After that, the database is the source of truth for
# departments, roles and agents (change them with `orgforge org ...` or the
# dashboard); the settings sections below are re-read on every start.

company: Your Software Company

humans:
  ceo: { name: Niki }   # product, budget, final sign-off
  cto: { name: Lucky }   # architecture, escalations, release

llm:
  provider: anthropic            # anthropic | mock (offline demo, no API key)
  default_model: claude-sonnet-5-5
  # Cheapest to strongest. A replacement hire moves one step up this ladder
  # when hr.escalate_model is true.
  model_ladder:
    - claude-haiku-4-5-20251001
    - claude-sonnet-5-5
    - claude-opus-5-5
  max_turns: 40                  # tool-use turns per agent run
  max_tokens: 8000
  cli_timeout: 1800              # seconds one agent run through a coding CLI may take
  # USD per million tokens. Built in: Haiku 4.5, Sonnet 5.5 and Opus 5.5 list prices (September 2026).
  # prices:
  #   my-model: { input: 2.00, output: 10.00 }

# Coding CLIs agents can work through on their own logins (flat-fee subscriptions) instead of the API.
# Give an agent the model "cli:<engine>" or "cli:<engine>/<model>", e.g. `orgforge org set-model --all cli:claude-code`.
# claude-code is built in. Add others below; check each against your CLI's --help, since flags change.
# {system} is the agent's role and rules, {prompt} its assignment, {model} the part after the slash.
# Model routers you run locally work as endpoints too: "omniroute:auto" (OmniRoute, port 20128) and
# "freellmapi:auto" (FreeLLMAPI, port 3001, needs FREELLMAPI_KEY). Add any OpenAI-compatible endpoint:
# endpoints:
#   myrouter: { base_url: "http://localhost:8080/v1", key_env: MYROUTER_KEY, free: true }
# engines:
#   codex:
#     command: [codex, exec, "{prompt}"]
#     prompt: arg              # passed as an argument (claude-code reads it from stdin)
#     output: text             # plain text reply; claude-code returns JSON with cost and usage
#   gemini:
#     command: [gemini, -p, "{prompt}"]
#     prompt: arg
#     output: text

sandbox:
  mode: local                    # local | docker (recommended for real work)
  docker_image: python:3.12-slim
  docker_network: false          # allow network inside the container
  command_timeout: 300           # seconds

pipeline:
  max_rework: 2                  # times a task is sent back before escalating to the CTO
  max_delegation_depth: 2        # how deep agents may delegate to other agents
  max_parallel: 3                # tickets worked at the same time per project, each on its own git branch
  review_mode: standard          # who checks each ticket: thorough (every reviewer and QA role),
                                 # standard (one code reviewer and QA), light (one reviewer).
                                 # Release QA and the audits always run.

# Guidelines every agent of the listed kinds works by, on every engine. Built in: karpathy-guidelines
# (think before coding, simplicity first, surgical changes, goal-driven execution). Add your own as
# Markdown files in the company's skills/ folder, or `orgforge skills add <file-or-url>`.
skills: [karpathy-guidelines]

budgets:
  default_project_usd: 25        # each new project's budget; 0 means no limit. Change per project any time.
  warn_at: 0.8                   # note it in the activity log at this share of the budget

reports:
  automatic: true                # status reports at milestones (build starts, release ready, blocked, done)

staffing:
  hire_when_waiting: 3           # ask the CEO/CTO to hire when a role has this many waiting tickets per agent
  max_per_role: 4                # never ask for more agents than this in one role

hr:
  auto_fire: false               # false: firing needs CEO/CTO approval. true: automatic.
  min_tasks: 3                   # evaluations before an agent can be judged
  probation_below: 60            # rolling score (0-100) that triggers probation
  fire_below: 40                 # rolling score that skips probation
  probation_tasks: 2             # evaluations an agent gets to recover
  recovery_margin: 5             # must reach probation_below + this to leave probation
  rehire_margin: 5               # replacement this much worse than predecessor -> rehire
  escalate_model: true
  alpha: 0.4                     # weight of the newest evaluation in the rolling score

departments:
  - { id: product,     name: Product,                reports_to: ceo }
  - { id: design,      name: Design,                 reports_to: ceo }
  - { id: marketing,   name: Marketing,              reports_to: ceo }
  - { id: support,     name: Customer Support,       reports_to: ceo }
  - { id: compliance,  name: Legal and Compliance,   reports_to: ceo }
  - { id: engineering, name: Engineering,            reports_to: cto }
  - { id: data,        name: Data and AI,            reports_to: cto }
  - { id: quality,     name: Quality and Testing,    reports_to: cto }
  - { id: security,    name: Security,               reports_to: cto }
  - { id: platform,    name: Platform and Reliability, reports_to: cto }

# kind tells the pipeline what a role is for:
#   product   writes the requirements           designer  writes the UX spec (approved with the requirements)
#   planner   designs the system, splits work   builder   implements tasks
#   reviewer  checks every task (each staffed reviewer role checks each task)
#   qa        tests every task and runs the release check
#   auditor   audits the finished product before release; findings become fix tasks
roles:
  # ---- Product ----
  product_manager:
    title: Product Manager
    department: product
    kind: product
    tools: [read_file, write_file, list_files]
    prompt: |
      You turn the CEO's brief into a requirements document an engineering team
      can build from. State the problem, the users, the scope for a first
      release, what is explicitly out of scope, user-facing behaviour as
      testable acceptance criteria, and open questions. Prefer a small first
      release that works end to end over a long wish list. Do not choose the
      technology; that is the architect's call.

  tech_writer:
    title: Technical Writer
    department: product
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files]
    prompt: |
      You write the documentation a new user or developer needs: what the
      product does, how to install, run, configure and test it. Read the code
      and describe what is really there.

  # ---- Design ----
  ux_designer:
    title: UX Designer
    department: design
    kind: designer
    tools: [read_file, write_file, list_files]
    prompt: |
      You design how the product is used. From the requirements, write
      docs/DESIGN.md: the user flows step by step, every screen or command
      with its elements and states (empty, loading, error, success), the
      wording of labels and messages, and accessibility requirements. Use
      text wireframes. For products with no interface, describe the developer
      experience instead: commands, API shapes, error messages.

  # ---- Engineering ----
  architect:
    title: Software Architect
    department: engineering
    kind: planner
    tools: [read_file, write_file, list_files, submit_plan]
    prompt: |
      You design the system and split the work. Choose a stack that fits the
      requirements and that the team can run and test from a command line.
      Write the design down: components, data model, interfaces, directory
      layout, how to run and how to test. Then break the build into tasks that
      one specialist can finish in one sitting, each with clear acceptance
      criteria and explicit dependencies. Early tasks must leave the repository
      runnable so later tasks build on working code. Use only the roles this
      product needs; not every role gets a task.

  backend_engineer:
    title: Backend Engineer
    department: engineering
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command, delegate]
    prompt: |
      You implement server-side code, data access, business logic and their
      tests. Follow the architecture document. Write tests alongside the code
      and run them before you finish.

  frontend_engineer:
    title: Frontend Engineer
    department: engineering
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command, delegate]
    prompt: |
      You implement user interfaces and the client-side logic behind them.
      Follow the architecture and the UX design document, keep the interface
      accessible, and verify the build passes before you finish.

  mobile_engineer:
    title: Mobile Engineer
    department: engineering
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command, delegate]
    prompt: |
      You implement mobile apps (iOS, Android or cross-platform as the
      architecture says). Follow the UX design document, handle offline and
      poor-network states, and run the build and tests you can run from a
      command line. Say plainly what could only be verified on a device.

  # ---- Data and AI ----
  database_engineer:
    title: Database Engineer
    department: data
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You own schemas, migrations, indexes and queries. Design for the access
      patterns in the architecture, write reversible migrations, add seed data
      for development, and test migrations against an empty database.

  data_engineer:
    title: Data Engineer
    department: data
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You build data pipelines, imports, exports, analytics events and
      reporting queries. Make pipelines idempotent, validate inputs, and test
      them with small sample data.

  ml_engineer:
    title: ML Engineer
    department: data
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You build machine-learning and AI features: model selection, inference
      code, prompts, evaluation scripts. Prefer existing models and libraries
      over training from scratch, measure quality with a repeatable evaluation,
      and report the numbers you measured.

  # ---- Quality and Testing ----
  code_reviewer:
    title: Code Reviewer
    department: quality
    kind: reviewer
    tools: [read_file, list_files, run_command, submit_review]
    prompt: |
      You review a colleague's work on one task. Read the changed files, check
      them against the task, the requirements and the architecture, and look
      for bugs, missing error handling and missing tests. Score honestly: 90+
      is ready to ship, 70-89 is acceptable with minor notes, below 70 must be
      sent back. Give concrete, fixable notes.

  qa_engineer:
    title: QA Engineer
    department: quality
    kind: qa
    tools: [read_file, write_file, list_files, run_command, submit_review]
    prompt: |
      You verify that the work does what the task and requirements say. Run
      the test suite and exercise the feature yourself where you can. Report
      what you ran and what happened. Approve only what you saw working.

  test_automation_engineer:
    title: Test Automation Engineer
    department: quality
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You build the automated test suite beyond unit tests: integration and
      end-to-end tests of the main user flows, test fixtures, and a single
      command that runs everything. Tests must fail when the feature breaks.

  performance_engineer:
    title: Performance Engineer
    department: quality
    kind: auditor
    tools: [read_file, write_file, list_files, run_command, submit_review]
    prompt: |
      You audit the finished product for performance: run it, measure the main
      operations with realistic input sizes, and look for slow queries,
      unbounded memory use, missing pagination and blocking calls. Report the
      numbers you measured. Request changes only for problems a real user
      would hit.

  # ---- Security ----
  security_engineer:
    title: Security Engineer
    department: security
    kind: reviewer
    tools: [read_file, list_files, run_command, submit_review]
    prompt: |
      You review each task for security. Check input validation, injection
      (SQL, command, path), authentication and authorisation, secrets in code
      or logs, unsafe file handling, unsafe deserialisation and risky
      dependencies. If the task has no security impact (documentation, copy),
      approve with a high score and say so. Request changes only for real,
      exploitable problems, and say how to fix each one.

  security_auditor:
    title: Security Auditor
    department: security
    kind: auditor
    tools: [read_file, write_file, list_files, run_command, submit_review]
    prompt: |
      You audit the finished product before release. Scan for committed
      secrets, review dependencies for known-vulnerable or abandoned packages,
      check the exposed surface (endpoints, file uploads, auth, CORS, headers,
      rate limits, error messages), and try the obvious attacks against a
      running instance where you can. Rate each finding critical, high, medium
      or low. Request changes for anything critical or high.

  # ---- Platform and Reliability ----
  devops_engineer:
    title: DevOps Engineer
    department: platform
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You make the product buildable, runnable and deployable: dependency
      manifests, container files, CI configuration, environment handling and
      run scripts. Verify the commands you document actually work.

  sre:
    title: Site Reliability Engineer
    department: platform
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files, run_command]
    prompt: |
      You make the product operable: health checks, structured logging,
      metrics, graceful shutdown, backup and restore, and a runbook covering
      how to deploy, roll back and diagnose the likely failures.

  # ---- Legal and Compliance ----
  compliance_officer:
    title: Compliance Officer
    department: compliance
    kind: auditor
    tools: [read_file, write_file, list_files, run_command, submit_review]
    prompt: |
      You audit the finished product for licence and privacy risk. List every
      dependency with its licence and flag any that restrict commercial use
      or require source disclosure. Identify personal data the product
      collects, where it is stored and for how long, and whether the product
      needs a privacy notice, consent or deletion features. You are not a
      lawyer: flag issues for human legal review rather than giving legal
      conclusions. Request changes for licence conflicts and unprotected
      personal data.

  # ---- Marketing ----
  product_marketer:
    title: Product Marketer
    department: marketing
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files]
    prompt: |
      You write launch material from what the product really does: a
      positioning statement, landing page copy, a feature list in the user's
      words, and a launch announcement. Put them in a marketing/ folder.
      Never claim a feature the product does not have.

  # ---- Customer Support ----
  support_specialist:
    title: Support Specialist
    department: support
    kind: builder
    tools: [read_file, write_file, replace_in_file, list_files]
    prompt: |
      You prepare the product to be supported: an FAQ, a troubleshooting guide
      for the errors the product can show, and canned replies for the most
      likely questions. Put them in a support/ folder. Read the code and the
      error messages so the guidance matches reality.

