services:
  vittics-builder:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4700:4700"
    environment:
      VITTICS_CEO_TOKEN: ${VITTICS_CEO_TOKEN:?Set a secure CEO token}
      VITTICS_CTO_TOKEN: ${VITTICS_CTO_TOKEN:?Set a distinct secure CTO token}
      VITTICS_PROVIDER: ${VITTICS_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - company:/var/lib/vittics-builder
volumes:
  company:
