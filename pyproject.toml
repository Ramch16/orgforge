[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgforge"
version = "0.10.0"
description = "An AI-staffed software company you run as CEO, with a human CTO: agents plan, build, review and ship software, and get replaced when they underperform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
orgforge = "orgforge.cli:main"

[tool.setuptools.packages.find]
include = ["orgforge*"]

[tool.setuptools.package-data]
orgforge = ["default_org.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
