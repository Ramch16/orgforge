[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vittics-builder"
version = "0.19.0"
description = "An AI-staffed software company you run as CEO, with a human CTO: agents plan, build, review and ship software, and get replaced when they underperform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
mcp = ["mcp>=1.12,<2"]
browser = ["playwright>=1.48,<2"]
desktop = ["pyinstaller>=6.10"]

[project.scripts]
vittics-builder = "vittics_builder.cli:main"
orgforge = "vittics_builder.cli:legacy_main"      # the old name, kept for one release

[tool.setuptools.packages.find]
include = ["vittics_builder*"]

[tool.setuptools.package-data]
vittics_builder = ["default_org.yaml", "static/*", "skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
